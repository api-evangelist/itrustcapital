name: iTrustCapital
description: 'iTrustCapital (legal entity ITC2.0, Inc.) is a US fintech software platform
  for alternative assets, offering 24/7 self-directed access to dozens of cryptocurrencies
  and physical precious metals through three account types: tax-advantaged self-directed
  Crypto IRAs for retirement savings, Premium Custody Accounts (PCA) for everyday non-retirement
  investing, and Treasury Accounts for businesses, trusts, non-profits and other entities.
  The platform charges a 1% cryptocurrency transaction fee with no monthly, annual,
  startup, exit, storage or transfer fees, and runs a closed-loop system backed by
  third-party US banks, custodians (iTrust Custodial Services, Fortis Bank) and institutional
  storage providers. iTrustCapital is not an exchange, custodian, trust company, broker-dealer
  or investment adviser; all transactions on the platform are self-directed. As of
  this profiling pass the company publishes NO public developer API — its own help
  center states that it "does not offer any API integration to any third-party applications,
  including self-trading bots and coin trackers." Access is via the web app and the
  iOS/Android mobile apps only.'
