summary: 'No /.well-known/ discovery document is published on any iTrustCapital host.
  The marketing site (www.itrustcapital.com, Next.js) answers HTTP 200 with the SPA
  HTML shell for EVERY unknown path, including every /.well-known/* path, /openapi.json,
  /swagger.json and /llms.txt. Those 200s are catch-all false positives, NOT documents:
  each returns Content-Type text/html with a <!DOCTYPE html> body. They are recorded
  below as status 200 with present:false and the observed content type so a future
  re-run does not mistake them for hits. The application host (app.itrustcapital.com)
  is behind Cloudflare bot management and returns HTTP 403 to anonymous probes.'
